[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "docsdelta-apify"
version = "0.2.0"
description = "Public docs to clean Markdown, bounded RAG chunks and explicit page change feed."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["aiohttp>=3.12,<4", "beautifulsoup4>=4.13,<5"]

[project.optional-dependencies]
actor = ["apify>=3.4,<4"]

[project.scripts]
docsdelta = "docsdelta.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
